<g class="i5">
<line x1="60" y1="468" x2="1140" y2="468" stroke="#3a1a52"/>
<text class="hud" x="64" y="490">KAGGLE · US STOCK RETURN · RMSE <tspan class="hudv">41.60</tspan></text>
