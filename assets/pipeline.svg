<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Build pipeline: Frame, Data, Model, Evaluate, Ship">
<defs>
<style>
text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace}
.t{font-size:15px;font-weight:700;letter-spacing:3px;fill:#f6f3f7}
.d{font-size:11.5px;fill:#9aa3b2}
.n{font-size:12px;fill:#ff2d95;letter-spacing:2px}
.flow{stroke:#e11d48;stroke-width:2;stroke-dasharray:10 8;animation:dash 1.2s linear infinite}
.card{fill:#0d0a14;stroke:#3a1a2c;stroke-width:1.5}
.dot{animation:blink 5s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-18}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</defs>
<rect width="1200" height="240" fill="#07070c"/>
<line class="flow" x1="150" y1="95" x2="1050" y2="95"/>
<g>
<rect class="card" x="40" y="40" width="200" height="150" rx="10"/><circle class="dot" cx="140" cy="95" r="9" fill="#e11d48"/>
<text class="n" x="60" y="68">01</text><text class="t" x="60" y="140">FRAME</text><text class="d" x="60" y="162">Define the problem</text><text class="d" x="60" y="178">and the metric</text>
<rect class="card" x="260" y="40" width="200" height="150" rx="10"/><circle class="dot" cx="360" cy="95" r="9" fill="#e11d48" style="animation-delay:.8s"/>
<text class="n" x="280" y="68">02</text><text class="t" x="280" y="140">DATA</text><text class="d" x="280" y="162">Clean, validate,</text><text class="d" x="280" y="178">leak-proof splits</text>
<rect class="card" x="480" y="40" width="200" height="150" rx="10"/><circle class="dot" cx="580" cy="95" r="9" fill="#e11d48" style="animation-delay:1.6s"/>
<text class="n" x="500" y="68">03</text><text class="t" x="500" y="140">MODEL</text><text class="d" x="500" y="162">Boosted trees, RAG</text><text class="d" x="500" y="178">or agents</text>
<rect class="card" x="700" y="40" width="200" height="150" rx="10"/><circle class="dot" cx="800" cy="95" r="9" fill="#e11d48" style="animation-delay:2.4s"/>
<text class="n" x="720" y="68">04</text><text class="t" x="720" y="140">EVALUATE</text><text class="d" x="720" y="162">GroupKFold, RMSE,</text><text class="d" x="720" y="178">error analysis</text>
<rect class="card" x="920" y="40" width="240" height="150" rx="10" style="stroke:#e11d48"/><circle class="dot" cx="1040" cy="95" r="9" fill="#00e5ff" style="animation-delay:3.2s"/>
<text class="n" x="940" y="68">05</text><text class="t" x="940" y="140">SHIP</text><text class="d" x="940" y="162">Streamlit / React,</text><text class="d" x="940" y="178">deployed and live</text>
</g>
</svg>
