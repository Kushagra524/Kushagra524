</g>

<rect class="scanbar" x="0" y="0" width="1200" height="120" fill="url(#scan)"/>
<rect width="1200" height="520" fill="url(#lines)"/>
<g stroke="#ff2d95" stroke-opacity=".7" fill="none" stroke-width="2"><path d="M20 60 V20 H60"/><path d="M1140 20 H1180 V60"/><path d="M20 460 V500 H60"/><path d="M1180 460 V500 H1140"/></g>
<g transform="translate(1120 62)"><circle r="20" fill="#ff2d95"/><text x="0" y="8" text-anchor="middle" font-size="22" fill="#0d051a" font-weight="900" style="font-family:'Noto Sans JP','Yu Gothic','Meiryo',sans-serif">忍</text></g>

