<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Skill scrolls: Generative AI, Retrieval and Agents, Classical ML, Ship">
<defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e11d48"/><stop offset="1" stop-color="#ff2d95"/></linearGradient>
<style>
text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace}
.h{font-size:15px;font-weight:700;letter-spacing:3px;fill:#f6f3f7}
.i{font-size:14px;fill:#c9d1d9}
.k{font-size:11px;fill:#ff2d95;letter-spacing:2px}
.card{fill:#0d0a14;stroke:#3a1a2c;stroke-width:1.5}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 6s ease-in-out infinite}
.mk{fill:#00e5ff}
@keyframes grow{0%,8%{transform:scaleX(0)}30%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
</style>
</defs>
<rect width="1200" height="330" fill="#07070c"/>
<g>
<rect class="card" x="20" y="20" width="280" height="290" rx="10"/><rect class="bar" x="20" y="20" width="280" height="4" fill="url(#edge)"/>
<text class="k" x="42" y="56">// 01</text><text class="h" x="42" y="82">GENERATIVE AI</text>
<text class="i" x="42" y="122">&gt; LangChain</text><text class="i" x="42" y="152">&gt; LangGraph</text><text class="i" x="42" y="182">&gt; HuggingFace</text><text class="i" x="42" y="212">&gt; Groq (fast inference)</text><text class="i" x="42" y="242">&gt; Prompt engineering</text>
<rect class="card" x="320" y="20" width="280" height="290" rx="10"/><rect class="bar" x="320" y="20" width="280" height="4" fill="url(#edge)" style="animation-delay:.4s"/>
<text class="k" x="342" y="56">// 02</text><text class="h" x="342" y="82">RAG &amp; AGENTS</text>
<text class="i" x="342" y="122">&gt; RAG pipelines</text><text class="i" x="342" y="152">&gt; ChromaDB</text><text class="i" x="342" y="182">&gt; MMR retrieval</text><text class="i" x="342" y="212">&gt; ReAct agents</text><text class="i" x="342" y="242">&gt; Streaming output</text>
<rect class="card" x="620" y="20" width="280" height="290" rx="10"/><rect class="bar" x="620" y="20" width="280" height="4" fill="url(#edge)" style="animation-delay:.8s"/>
<text class="k" x="642" y="56">// 03</text><text class="h" x="642" y="82">CLASSICAL ML</text>
<text class="i" x="642" y="122">&gt; CatBoost</text><text class="i" x="642" y="152">&gt; XGBoost</text><text class="i" x="642" y="182">&gt; LightGBM</text><text class="i" x="642" y="212">&gt; SMOTE / imbalance</text><text class="i" x="642" y="242">&gt; Cosine-similarity recsys</text>
<rect class="card" x="920" y="20" width="260" height="290" rx="10"/><rect class="bar" x="920" y="20" width="260" height="4" fill="url(#edge)" style="animation-delay:1.2s"/>
<text class="k" x="942" y="56">// 04</text><text class="h" x="942" y="82">SHIP</text>
<text class="i" x="942" y="122">&gt; Python</text><text class="i" x="942" y="152">&gt; Streamlit Cloud</text><text class="i" x="942" y="182">&gt; React dashboards</text><text class="i" x="942" y="212">&gt; Git / GitHub</text><text class="i" x="942" y="242">&gt; Kaggle workflows</text>
</g>
</svg>
