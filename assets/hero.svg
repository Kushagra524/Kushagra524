<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Kushagra Srivastava, AI/ML Engineer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05050a"/><stop offset="1" stop-color="#1a0713"/></linearGradient>
<radialGradient id="moon" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff3b5c"/><stop offset="0.7" stop-color="#d4123a"/><stop offset="1" stop-color="#8a0b27"/></radialGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e11d48" stop-opacity="0.45"/><stop offset="1" stop-color="#e11d48" stop-opacity="0"/></radialGradient>
<linearGradient id="blade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0.6"/></linearGradient>
<linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0b14"/><stop offset="1" stop-color="#05050a"/></linearGradient>
<style>
text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace}
.name{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:68px;letter-spacing:10px;fill:#f6f3f7;animation:reveal 9s ease-out infinite}
.role{font-size:20px;letter-spacing:8px;fill:#ff2d95;animation:reveal 9s ease-out infinite;animation-delay:.25s}
.sub{font-size:14px;letter-spacing:3px;fill:#9aa3b2;animation:reveal 9s ease-out infinite;animation-delay:.5s}
.slash{stroke:url(#blade);stroke-width:3;stroke-linecap:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:cut 9s cubic-bezier(.2,.8,.2,1) infinite}
.slash2{stroke:#e11d48;stroke-width:8;opacity:.35;stroke-linecap:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:cut 9s cubic-bezier(.2,.8,.2,1) infinite;filter:blur(3px)}
.star{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
.star2{transform-box:fill-box;transform-origin:center;animation:spin 5s linear infinite reverse}
.pet{fill:#ff9ccb;opacity:.85;animation:fall 11s linear infinite}
.moonpulse{animation:pulse 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes cut{0%,6%{stroke-dashoffset:1400;opacity:1}22%{stroke-dashoffset:0;opacity:1}60%{stroke-dashoffset:0;opacity:1}80%,100%{stroke-dashoffset:-1400;opacity:0}}
@keyframes reveal{0%,10%{opacity:0;transform:translateX(-24px) skewX(-8deg)}24%{opacity:1;transform:translateX(0) skewX(0)}92%{opacity:1}100%{opacity:.0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0)}100%{transform:translate(-160px,480px) rotate(540deg)}}
@keyframes pulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
</style>
</defs>
<rect width="1200" height="440" fill="url(#bg)"/>
<circle class="moonpulse" cx="960" cy="170" r="190" fill="url(#glow)"/>
<circle cx="960" cy="170" r="104" fill="url(#moon)"/>
<path d="M0 360 L120 270 L210 330 L330 220 L450 320 L540 270 L660 350 L780 250 L900 330 L1020 240 L1120 310 L1200 270 L1200 440 L0 440Z" fill="#0d0a14" opacity=".9"/>
<path d="M0 400 L150 330 L260 380 L400 300 L520 385 L680 320 L820 395 L980 310 L1100 380 L1200 340 L1200 440 L0 440Z" fill="url(#ink)"/>
<g stroke="#e11d48" stroke-opacity=".5" fill="none"><path d="M60 40 H180"/><path d="M60 40 V70"/><path d="M1140 400 H1020"/><path d="M1140 400 V370"/></g>
<g>
<circle cx="1050" cy="70" r="30" fill="none" stroke="#e11d48" stroke-width="2" opacity=".0"/>
</g>
<polygon class="star" points="110,100 122,128 150,140 122,152 110,180 98,152 70,140 98,128" fill="#c9d1d9" stroke="#00e5ff" stroke-width="1.5"/>
<polygon class="star2" points="1100,330 1108,348 1126,356 1108,364 1100,382 1092,364 1074,356 1092,348" fill="#c9d1d9" opacity=".7"/>
<ellipse class="pet" cx="300" cy="0" rx="6" ry="3.5" style="animation-delay:0s"/>
<ellipse class="pet" cx="520" cy="0" rx="5" ry="3" style="animation-delay:-3s"/>
<ellipse class="pet" cx="720" cy="0" rx="6" ry="3.5" style="animation-delay:-6s"/>
<ellipse class="pet" cx="900" cy="0" rx="4.5" ry="2.5" style="animation-delay:-8s"/>
<ellipse class="pet" cx="1100" cy="0" rx="6" ry="3.5" style="animation-delay:-1.5s"/>
<ellipse class="pet" cx="180" cy="0" rx="5" ry="3" style="animation-delay:-4.5s"/>
<ellipse class="pet" cx="640" cy="0" rx="4" ry="2.5" style="animation-delay:-9.5s"/>
<g>
<text class="name" x="600" y="205" text-anchor="middle">KUSHAGRA</text>
<text class="name" x="600" y="280" text-anchor="middle" style="font-size:44px;letter-spacing:22px">SRIVASTAVA</text>
<text class="role" x="600" y="326" text-anchor="middle">AI / ML ENGINEER</text>
<text class="sub" x="600" y="358" text-anchor="middle">GENAI · RAG · AGENTS · APPLIED ML — SHIPPED, NOT SKETCHED</text>
</g>
<line class="slash2" x1="40" y1="395" x2="1160" y2="45"/>
<line class="slash" x1="40" y1="395" x2="1160" y2="45"/>
<g transform="translate(1085 92)"><circle r="22" fill="#d4123a"/><text x="0" y="9" text-anchor="middle" font-size="26" fill="#05050a" font-weight="700" style="font-family:'Noto Sans JP','Yu Gothic',sans-serif">忍</text></g>
</svg>
